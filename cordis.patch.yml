# Cordis bundle patch for DeepSeek Harness profiles.
#
# GENERATED by scripts/generate-artifacts.mjs from artifacts.json.
# Do not edit by hand: run `node scripts/generate-artifacts.mjs` instead.
#
# Applied automatically when this package is installed through dsh's own
# plugin command — for example
#
#   dsh plugin --profile web add dsh-skill-superpowers
#   dsh plugin --profile web add link:/path/to/this-package
#
# The dsh CLI appends every dependency that declares `dsh.bundle`
# (see package.json) to the profile's `dsh.profile.bundles`, and each
# bundle's patch is layered into the composed configuration at boot.
# Nothing here edits a user's config: the install artifact is the install.
#
# The row mounts `index.js`, which
#   1. serves this package's vendored `skills/` tree through dsh's OWN
#      `@deepseek-ai/dsh-skill-filesystem` provider (a private instance at
#      `bundledSkillDir`, rank 600), so the skills load with dsh's native
#      `skill` tool and inherit that provider's parsing, watching and fixes; and
#   2. contributes the `using-superpowers` bootstrap — with the dsh tool
#      mapping — as the `superpowers:bootstrap` system-prompt section.

- insert:
    - id: superpowers
      name: 'dsh-skill-superpowers'
      config:
        # Register the skills catalog. false = bootstrap only.
        skills: true
        # Inject the using-superpowers bootstrap into the system prompt.
        bootstrap: true
        # Append the dsh tool mapping to the bootstrap.
        toolMapping: true
        # Skill-provider name registered on ctx.skills.
        providerName: "superpowers"
        # Skills root. Empty = resolve automatically: config → SUPERPOWERS_SKILLS_DIR → <package>/skills → <package>/../skills.
        skillsDir: ""
